# Team-Tool (läuft auf Railway). Sobald der CNAME tool.skill-studios.com bei STRATO gesetzt ist, hier die Ziel-Domain tauschen.
[[redirects]]
  from = "/team"
  to = "https://tool-production-4250.up.railway.app/team"
  status = 302
[[redirects]]
  from = "/team/*"
  to = "https://tool-production-4250.up.railway.app/team/:splat"
  status = 302

# Unbekannte Pfade: echte 404 statt Startseite
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Header ─────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://connect.facebook.net https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com https://www.facebook.com https://www.google.com https://www.google.de https://*.doubleclick.net https://*.google.com https://*.google.de https://www.googleadservices.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://api.stripe.com https://m.stripe.network https://r.stripe.com https://skillathletic.api.magicline.com https://connect.facebook.net https://www.facebook.com https://www.google.com https://www.google.de https://www.googleadservices.com https://*.doubleclick.net https://*.google.com https://*.google.de https://www.googletagmanager.com https://pagead2.googlesyndication.com; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network https://widgets.mywellness.com https://td.doubleclick.net https://www.googletagmanager.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
